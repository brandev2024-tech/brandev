<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Page not found — Alfred Calawa</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#0b0b0f; --text:#f2f1ec; --muted:#8f8e9a; --accent:#6d28d9; --accent-ink:#9b7bf5; --on-accent:#fff; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg:#f4f1ea; --text:#141413; --muted:#5f5c55; --accent-ink:#4c1d95; --accent:#4c1d95; --on-accent:#fff; color-scheme: light; } }
    body { margin:0; min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--text);
      font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; padding:16px; }
    h1 { font-size: clamp(5rem, 22vw, 12rem); margin:0; line-height:1; letter-spacing:-0.05em; }
    h1 span { color: var(--accent-ink, var(--accent)); }
    p { color: var(--muted); }
    a { display:inline-block; margin-top:1.5rem; padding:.9rem 1.5rem; border-radius:999px; background:var(--accent); color:var(--on-accent, #0b0b0f); font-weight:600; text-decoration:none; }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  </style>
</head>
